apiVersion: 1

datasources:
  - name: DEMO ONLY - Mock AI (no inference)
    uid: intelligence-gateway-secure
    type: digitalrcs-intelligencegateway-datasource
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      reviewMock: true
      provider: custom
      baseUrl: http://mock-ai:8080/v1
      defaultModel: review-model
      timeoutSeconds: 300
      allowedModels:
        - review-model
      maxOutputTokens: 256000
      allowInsecureHttp: true
      # Synthetic test provider only; real providers require an approved vision-capable model.
      enableVision: true
      allowedVisionModels:
        - review-model
