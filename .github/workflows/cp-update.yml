name: Create Plugin Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # run once a month on the 1st day

# Allow GitHub Actions to create pull requests in the repository Actions settings.
# Optional GH_PAT_TOKEN supports migrations that modify workflow files and
# triggering CI without the approval required for pull requests from GITHUB_TOKEN.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: grafana/plugin-actions/create-plugin-update@create-plugin-update/v2.0.2
        with:
          token: ${{ secrets.GH_PAT_TOKEN || github.token }}
          node-version: '22'
