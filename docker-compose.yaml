services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    ports: !override
      - 3004:3000/tcp
    volumes:
      - grafana-storage:/var/lib/grafana
      - ${INTELLIGENCE_GATEWAY_DATASOURCE_DIST:-../digitalrcs-intelligencegateway-datasource/dist}:/var/lib/grafana/plugins/digitalrcs-intelligencegateway-datasource
    environment:
      GF_LOG_FILTERS: plugin.digitalrcs-intelligencegateway-panel:debug plugin.digitalrcs-intelligencegateway-datasource:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: digitalrcs-intelligencegateway-panel,digitalrcs-intelligencegateway-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mock-ai:
        condition: service_healthy

  mock-ai:
    build:
      context: ./testdata/mock-provider
    container_name: digitalrcs-intelligencegateway-panel-mock-ai
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models')"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  grafana-storage:
